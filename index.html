<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>peeen의 프로필 | About Me</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e1e2f 0%, #151522 100%);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-color: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --highlight: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
      color: var(--text-main);
      padding: 24px;
      overflow-x: hidden;
    }

    /* Background glow effect */
    .bg-circle {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }
    .circle-1 {
      width: 320px;
      height: 320px;
      background: #6366f1;
      top: 10%;
      left: 15%;
    }
    .circle-2 {
      width: 280px;
      height: 280px;
      background: #ec4899;
      bottom: 10%;
      right: 15%;
    }

    /* Container Card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 48px rgba(99, 102, 241, 0.15);
    }

    /* Avatar & Emoji */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
    }

    .avatar-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent-gradient);
      padding: 3px;
      box-shadow: 0 0 24px rgba(99, 102, 241, 0.5);
      animation: pulse 3s infinite ease-in-out;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      background: #181824;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      user-select: none;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar-inner:hover {
      transform: scale(1.15) rotate(-5deg);
    }

    .avatar-inner:active {
      transform: scale(0.95);
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      }
      50% {
        box-shadow: 0 0 35px rgba(236, 72, 153, 0.6);
      }
    }

    /* Profile Info */
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 12px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bio {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Details Grid */
    .info-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
      text-align: left;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .info-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateX(4px);
    }

    .info-icon {
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      flex-shrink: 0;
    }

    .info-content {
      flex: 1;
    }

    .info-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Interactive Button */
    .action-btn {
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: var(--accent-gradient);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .action-btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(99, 102, 241, 0.45);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #222236;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- Ambient Lights -->
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>

  <!-- Main Card -->
  <main class="card">
    <div class="avatar-wrapper">
      <div class="avatar-bg"></div>
      <div class="avatar-inner" id="emojiAvatar" title="눌러보세요!">🤔</div>
    </div>

    <span class="tag">Profile</span>
    <h1 class="name">peeen</h1>
    <p class="bio">반갑습니다! 생각을 즐기고 새로운 세계를 탐험하는 peeen입니다.</p>

    <div class="info-grid">
      <!-- 닉네임 -->
      <div class="info-item">
        <div class="info-icon">👤</div>
        <div class="info-content">
          <div class="info-label">닉네임</div>
          <div class="info-value">peeen</div>
        </div>
      </div>

      <!-- 취미 -->
      <div class="info-item">
        <div class="info-icon">🎮</div>
        <div class="info-content">
          <div class="info-label">취미</div>
          <div class="info-value">게임 (Gaming)</div>
        </div>
      </div>

      <!-- 좋아하는 이모지 -->
      <div class="info-item">
        <div class="info-icon">🤔</div>
        <div class="info-content">
          <div class="info-label">좋아하는 이모지</div>
          <div class="info-value">🤔 (Thinking Face)</div>
        </div>
      </div>
    </div>

    <button class="action-btn" id="helloBtn">인사 나누기 👋</button>
    
    <div class="footer">
      © 2026 peeen. All rights reserved.
    </div>
  </main>

  <!-- Toast message -->
  <div class="toast" id="toast">반가워요! peeen의 페이지에 오신 걸 환영합니다 ✨</div>

  <script>
    const emojiAvatar = document.getElementById('emojiAvatar');
    const helloBtn = document.getElementById('helloBtn');
    const toast = document.getElementById('toast');

    // 이모지 클릭 시 재밌는 반응
    const thoughts = [
      "음... 무슨 게임을 해볼까? 🤔",
      "흥미로운 생각이 떠올랐어! 💡",
      "흠... 🤔🤔🤔",
      "오늘도 즐거운 하루 보내세요! ✨",
      "peeen 월드에 접속 중... 🎮"
    ];
    let thoughtIndex = 0;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    emojiAvatar.addEventListener('click', () => {
      thoughtIndex = (thoughtIndex + 1) % thoughts.length;
      showToast(thoughts[thoughtIndex]);
    });

    helloBtn.addEventListener('click', () => {
      showToast("🎮 peeen님과 연결되었습니다! 즐거운 게임 라이프 되세요!");
    });
  </script>
</body>
</html>
